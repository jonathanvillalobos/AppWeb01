{% extends "layaout.html" %}

{% block content %}
    <div class="container">
        <h1>Productos</h1>
        <p>{{ mensaje }}</p>
        <p>Aquí puedes encontrar información sobre los productos que ofrecemos.</p>
    </div>

    <div id="carouselExampleControls" class="carousel slide mi-carrusel" data-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img
                    src="{{ url_for('static', filename='img/Productos/pan.png') }}"
                    class="d-block w-100"
                    alt="Pan">
            </div>
            <div class="carousel-item">
                <img
                    src="{{ url_for('static', filename='img/Productos/enchiladas.png') }}"
                    class="d-block w-100"
                    alt="Enchiladas">
            </div>
            <div class="carousel-item">
                <img
                    src="{{ url_for('static', filename='img/Productos/cempasuchil.png') }}"
                    class="d-block w-100"
                    alt="Flor de cempasúchil">
            </div>
        </div>

        <a
            class="carousel-control-prev"
            href="#carouselExampleControls"
            role="button"
            data-slide="prev"
            aria-label="Anterior">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </a>
        <a
            class="carousel-control-next"
            href="#carouselExampleControls"
            role="button"
            data-slide="next"
            aria-label="Siguiente">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </a>
    </div>

{% endblock %}
